<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>서랍</title>
<meta name="description" content="나만 쓰는 메모 서랍">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="서랍">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
/* Layout: single-column notes list, oldest at top — large title + segmented filter, pinned shelf, cards; viewer, editor and settings open as sheets */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --sub:#6E6E73; --hair:rgba(0,0,0,.08); --fill:#E9E9EE;
  --accent:#0071E3; --pin:#E8890C; --danger:#E5332A; --ok:#1E9E4A; --scrim:rgba(0,0,0,.32);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 6px 18px -6px rgba(0,0,0,.10);
  --glass:rgba(245,245,247,.82);
  --f:"Pretendard",-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --sub:#98989D; --hair:rgba(255,255,255,.10); --fill:#2C2C2E;
  --accent:#2997FF; --pin:#FFB340; --danger:#FF5A50; --ok:#34C759; --scrim:rgba(0,0,0,.6);
  --shadow:0 0 0 1px rgba(255,255,255,.04); --glass:rgba(0,0,0,.72);
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{font-size:max(16px,1em)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}

/* header */
.hd{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);margin-inline:-16px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:10px}
.hd-row{display:flex;align-items:center;gap:8px}
.hd h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.status{flex:1;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:6px}
.status.err{color:var(--danger)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.ib:hover{background:var(--fill)}
.ib svg{width:21px;height:21px}
.ib.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search input{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill);padding-inline:12px;font-size:16px}
.search input:focus{outline:2px solid var(--accent);outline-offset:0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg .n{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}

/* list */
main{display:flex;flex-direction:column;gap:24px;padding-top:12px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.sec h2 svg{width:13px;height:13px;color:var(--pin)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:transform .15s ease}
.card:active{transform:scale(.99)}
.card.flash{animation:flash 1.4s ease}
.card.sending{opacity:.6}
@keyframes flash{0%,35%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.pics{display:grid;gap:2px;background:var(--fill)}
.pics.n2,.pics.n3,.pics.n4{grid-template-columns:1fr 1fr}
.pics.n3>:first-child{grid-column:span 2}
.pic{position:relative;background:var(--fill);overflow:hidden;width:100%;max-height:min(75vh,640px)}
.pics:not(.n1) .pic{aspect-ratio:1/1}
.pics.n3>.pic:first-child{aspect-ratio:2/1}
.pic img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
.pic img.on,.pg img.on{opacity:1}
.pdfcard{display:flex;flex-direction:column;border-radius:11px;overflow:hidden;background:var(--fill)}
.pdfcard .pp{padding:10px 10px 0}
.pdfcard .pg{position:relative;width:100%;max-height:min(66vh,520px);overflow:hidden}
.pdfcard .pg img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
.pdfcard .pg img.on{opacity:1}
.pdfcard .ftile{border-radius:0}
.pic .more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-weight:600;font-size:17px}
.pic .play{position:absolute;inset:0;display:grid;place-items:center;background:#111}
.pic .play span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.pic .play svg{width:18px;height:18px;color:#fff;margin-left:2px}
.docs{display:flex;flex-direction:column;gap:6px;padding:12px 14px 0}
.ftile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;background:var(--fill);min-width:0}
.ext{flex:none;width:30px;height:38px;border-radius:5px;background:var(--sub);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;letter-spacing:.03em}
.ext.pdf{background:var(--danger)}
.ftile b{min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftile small{flex:none;margin-left:auto;font-size:12px;color:var(--sub)}
.ctext{margin:0;padding:12px 16px 0;font-size:16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:12;-webkit-box-orient:vertical;overflow:hidden}
.cm{padding:8px 16px 12px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.cm svg{width:12px;height:12px;color:var(--pin)}

.empty{padding:56px 12px;text-align:center;color:var(--sub);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-size:17px}
.empty p{margin:0;max-width:300px;font-size:14px}

.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;height:52px;padding-inline:20px 22px;border-radius:26px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px -6px rgba(0,113,227,.55)}
.fab svg{width:20px;height:20px}

/* setup */
.setup{max-width:460px;margin:0 auto;padding-block:calc(40px + env(safe-area-inset-top,0px)) 60px;display:flex;flex-direction:column;gap:18px}
.setup h1{margin:0;font-size:30px;letter-spacing:-.02em}
.setup p{margin:0;color:var(--sub);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea{width:100%;border:1px solid var(--hair);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical;font-family:var(--mono);font-size:16px}
.field small{font-size:12px;color:var(--sub)}
.btnp{height:46px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.btnp:disabled{opacity:.5}
.btns{height:42px;border-radius:12px;background:var(--fill);color:var(--accent);font-weight:600;font-size:15px}
.or{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--hair)}
.err{color:var(--danger);font-size:14px}

/* sheets */
.modal{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:center;justify-content:center}
.panel{background:var(--card);width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){.panel{height:auto;max-height:88vh;border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}}
.bar{flex:none;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--hair)}
@media (min-width:760px){.bar{padding-top:8px}}
.bar .ttl{flex:1;text-align:center;font-weight:600;font-size:16px}
.bar .spacer{flex:1}
.tb{height:36px;padding-inline:10px;border-radius:9px;color:var(--accent);font-size:16px;display:flex;align-items:center;gap:4px}
.tb:hover{background:var(--fill)}
.tb.strong{font-weight:600}
.tb.danger{color:var(--danger)}
.tb svg{width:21px;height:21px}
.tb:disabled{opacity:.4;cursor:default}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.vmeta{font-size:12px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.vmeta .pinned{color:var(--pin);font-weight:600}
.vtext{font-size:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;-webkit-user-select:text;user-select:text}
.vimg{display:block;width:100%;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--fill);cursor:zoom-in;min-height:60px}
.vimg img{display:block;width:100%;height:auto}
video{display:block;width:100%;border-radius:12px;background:#000;min-height:120px}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--fill);min-width:0}
.frow .fn{flex:1;min-width:0;display:flex;flex-direction:column}
.frow .fn b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fn small{font-size:12px;color:var(--sub)}
.open{flex:none;height:32px;padding-inline:14px;border-radius:16px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center}
.pdf{display:flex;flex-direction:column;gap:8px}
.pdf .pg{background:#fff;border-radius:6px;box-shadow:0 0 0 1px var(--hair);overflow:hidden}
.pdf canvas{display:block;width:100%;height:auto}
.pdf .note{font-size:13px;color:var(--sub);text-align:center;padding:12px}
.tview{margin:0;padding:12px;border-radius:12px;background:var(--fill);font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:60vh;overflow:auto}
.confirm{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--hair);background:var(--card)}
.confirm p{flex:1;margin:0;font-size:14px}
.pill{height:34px;padding-inline:14px;border-radius:17px;background:var(--fill);font-size:14px;font-weight:600}
.pill.danger{background:var(--danger);color:#fff}
.set h3{margin:6px 0 0;font-size:17px}
.set p{margin:0;font-size:14px;color:var(--sub)}
.set ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.set .row{display:flex;gap:8px;flex-wrap:wrap}
.set code{font-family:var(--mono);font-size:13px;background:var(--fill);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere}
.set .warn{color:var(--danger)}

/* editor: compact popup that sits on top of the keyboard */
#editor{align-items:flex-end;background:rgba(0,0,0,.18)}
.esheet{width:100%;max-width:600px;background:var(--card);border-radius:20px 20px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);transform:translateY(calc(-1 * var(--kb,0px)));transition:transform .18s ease}
#editor.kbopen .esheet{padding-bottom:10px}
@media (min-width:760px){#editor{align-items:center}.esheet{border-radius:18px;transform:none}}
.ehead{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.ehead span{font-size:13px;font-weight:600;color:var(--sub)}
.ehead button{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--sub);display:grid;place-items:center}
.ehead button svg{width:14px;height:14px}
#edText{width:100%;border:0;resize:none;background:var(--fill);border-radius:14px;padding:10px 12px;font-size:17px;line-height:1.45;min-height:46px;max-height:38vh;overflow-y:auto;display:block}
#edText:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.erow{display:flex;align-items:center;gap:6px}
.erow .sp{flex:1}
.ebtn{height:36px;padding-inline:12px;border-radius:18px;background:var(--fill);color:var(--accent);font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px}
.ebtn svg{width:18px;height:18px}
.esave{height:36px;padding-inline:18px;border-radius:18px;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
.esave:disabled{opacity:.45}
.tray{display:flex;gap:8px;overflow-x:auto}
.tray .att{flex:none}
.att{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--fill);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--sub);padding:6px;overflow-wrap:anywhere}
.att img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:14px;line-height:1}
.att .new{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:700;color:#fff;background:var(--accent);border-radius:4px;padding:0 4px}

.lightbox{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:calc(100% - 60px);object-fit:contain}
.lightbox .lbbar{display:flex;gap:22px}
.lightbox button{color:#fff;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.drop{position:fixed;inset:12px;z-index:25;border:2px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;font-weight:600;color:var(--accent);pointer-events:none}
@media (prefers-reduced-motion: reduce){.card,.pic img{transition:none}.card.flash{animation:none}.ib.spin svg{animation:none}}
</style>
</head>
<body>

<div class="wrap" id="setup" hidden></div>

<div class="wrap" id="app" hidden>
  <header class="hd">
    <div class="hd-row">
      <h1>서랍</h1>
      <span class="status" id="status" aria-live="polite"></span>
      <button class="ib" id="syncBtn" aria-label="지금 동기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg></button>
      <button class="ib" id="searchBtn" aria-label="검색" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="ib" id="setBtn" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="search" id="searchbar" hidden><input id="q" type="search" placeholder="검색" autocomplete="off"></div>
    <div class="seg" id="seg" role="group" aria-label="보기"></div>
  </header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>새 메모</button>

<div class="modal" id="viewer" hidden><div class="panel" role="dialog" aria-modal="true" aria-label="메모 보기" id="vpanel"></div></div>
<div class="modal" id="editor" hidden><div class="esheet" role="dialog" aria-modal="true" aria-label="메모 쓰기">
  <div class="ehead"><span id="edTitle">새 메모</span><button type="button" id="edCancel" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="tray" id="edTray" hidden></div>
  <textarea id="edText" rows="1" placeholder="메모" aria-label="메모 내용" enterkeyhint="enter"></textarea>
  <div class="erow">
    <button type="button" class="ebtn" id="edAdd" aria-label="사진·파일 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>사진</button>
    <button type="button" class="ebtn" id="edPasteBtn" aria-label="붙여넣기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h4"/></svg>붙여넣기</button>
    <span class="sp"></span>
    <button type="button" class="esave" id="edSave">저장</button>
  </div>
</div></div>
<input type="file" id="file" multiple hidden>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="drop" id="drop" hidden>놓으면 새 메모에 붙여요</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const main=$('#main');
const API='https://api.github.com';
const DATA='notes.json';
const MAX_FILE=25*1048576;
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const IC={
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.6 2.6a1 1 0 0 0-1.6.3l-1.3 3-4 2.2-3-.6a1 1 0 0 0-.9 1.7l3.6 3.6-4.2 5.6a.5.5 0 0 0 .7.7l5.6-4.2 3.6 3.6a1 1 0 0 0 1.7-.9l-.6-3 2.2-4 3-1.3a1 1 0 0 0 .3-1.6z"/></svg>',
  pinO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M15.6 2.6a1 1 0 0 0-1.6.3l-1.3 3-4 2.2-3-.6a1 1 0 0 0-.9 1.7l3.6 3.6-4.2 5.6a.5.5 0 0 0 .7.7l5.6-4.2 3.6 3.6a1 1 0 0 0 1.7-.9l-.6-3 2.2-4 3-1.3a1 1 0 0 0 .3-1.6z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',

/* ---------- GitHub API ---------- */
function headers(extra){return Object.assign({Authorization:'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28',Accept:'application/vnd.github+json'},extra||{})}
async function gh(method,path,body,extra){
  if(!navigator.onLine)throw{code:'offline'};
  const r=await fetch(API+path,{method,headers:headers(Object.assign(body?{'Content-Type':'application/json'}:{},extra||{})),body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(r.status===401){st.authErr=true;setStatus('토큰 확인 필요',true)}

}
async function must(r){if(r.ok||r.status===304)return r;let msg='';try{msg=(await r.json()).message||''}catch(e){}const e=new Error(msg||('HTTP '+r.status));e.status=r.status;e.msg=msg;throw e}
const repoBase=()=>'/repos/'+enc(cfg.owner)+'/'+enc(cfg.repo);
const contents=p=>repoBase()+'/contents/'+p.split('/').map(enc).join('/');

let q=Promise.resolve(),qn=0;
function enqueue(fn){qn++;spin();const p=q.then(fn);q=p.catch(()=>{}).then(()=>{qn--;spin()});return p}
function spin(){$('#syncBtn').classList.toggle('spin',qn>0)}

async function pull(force){
  const h={};if(server.etag&&!force)h['If-None-Match']=server.etag;
  const r=await gh('GET',contents(DATA)+'?ref='+enc(cfg.branch),null,h);
  if(r.status===304){setStatus('');return false}
  if(r.status===404){
    const msg=await r.clone().json().then(j=>j.message||'').catch(()=>'');
    if(/not found/i.test(msg)&&!(/empty/i.test(msg))){
      const rr=await gh('GET',repoBase());if(rr.status===404){await must(rr)}
    }
    await initData();return true;
  }
  await must(r);
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64decText(j.content);
  else{const b=await must(await gh('GET',repoBase()+'/git/blobs/'+j.sha));text=b64decText((await b.json()).content)}
  let data={};try{data=JSON.parse(text)}catch(e){data={}}
  server={notes:Array.isArray(data.notes)?data.notes:[],sha:j.sha,etag:r.headers.get('ETag')};
  st.authErr=false;saveCache();setStatus('');return true;
}
async function initData(){
  const r=await gh('PUT',contents(DATA),{message:'서랍 시작',content:b64encText(JSON.stringify({version:1,notes:[]},null,1)),branch:cfg.branch});
  if(r.status===422||r.status===409)return pull(true);
  await must(r);const j=await r.json();server={notes:[],sha:j.content.sha,etag:null};saveCache();
}
function display(){const n=clone(server.notes);pending.forEach(p=>{try{p(n)}catch(e){}});return n}
function mutate(fn,msg){
  pending.push(fn);render();
  return enqueue(async()=>{
    try{
      for(let i=0;;i++){
        const next=clone(server.notes);fn(next);
        const r=await gh('PUT',contents(DATA),{message:msg,content:b64encText(JSON.stringify({version:1,notes:next},null,1)),sha:server.sha||undefined,branch:cfg.branch});
        if((r.status===409||r.status===422)&&i<3){await pull(true);continue}
        await must(r);const j=await r.json();
        server={notes:next,sha:j.content.sha,etag:null};break;
      }
    }finally{const k=pending.indexOf(fn);if(k>-1)pending.splice(k,1);saveCache();render()}
  });
}
function saveCache(){try{localStorage.setItem('drawer-cache',JSON.stringify({notes:server.notes,sha:server.sha,etag:server.etag,repo:cfg&&cfg.owner+'/'+cfg.repo}))}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem('drawer-cache')||'null');if(c&&cfg&&c.repo===cfg.owner+'/'+cfg.repo){server={notes:c.notes||[],sha:c.sha,etag:c.etag};return true}}catch(e){}return false}

/* files */
const EXT={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','application/pdf':'pdf','video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov','text/plain':'txt','text/markdown':'md','text/csv':'csv','application/json':'json'};
function filePath(name,type){
  const d=new Date(),ext=(EXT[type]||((name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8))||'bin');
  return'files/'+d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+uid()+'.'+ext;
}
async function putNew(path,b64,message){
  for(let i=0;;i++){
    const r=await gh('PUT',contents(path),{message,content:b64,branch:cfg.branch});
    if(r.status===409&&i<3){await new Promise(z=>setTimeout(z,500));continue}
    await must(r);return(await r.json()).content.sha;
  }
}
async function uploadFile(p){
  const path=filePath(p.name,p.type);
  const b64=await blobToB64(p.blob);
  const tb64=p.thumb?await blobToB64(p.thumb.blob).catch(()=>null):null;
  return enqueue(async()=>{
    const sha=await putNew(path,b64,'첨부: '+p.name);
    cachePut(path,p.blob,p.type);
    const f={path,name:p.name,type:p.type,size:p.blob.size,sha};if(p.w){f.w=p.w;f.h=p.h}
    if(p.pages)f.pages=p.pages;
    if(tb64){
      const tp=path.replace(/\.[^./]+$/,'')+'.preview.jpg';
      try{const ts=await putNew(tp,tb64,'미리보기: '+p.name);cachePut(tp,p.thumb.blob,'image/jpeg');f.thumb={path:tp,sha:ts,w:p.thumb.w,h:p.thumb.h}}catch(e){}
    }
    return f;
  });
}
function deleteFile(f){
  return enqueue(async()=>{
    let sha=f.sha;
    if(!sha){const r=await gh('GET',contents(f.path)+'?ref='+enc(cfg.branch));if(r.status===404)return;await must(r);sha=(await r.json()).sha}
    for(let i=0;;i++){
      const r=await gh('DELETE',contents(f.path),{message:'첨부 삭제: '+(f.name||f.path),sha,branch:cfg.branch});
      if(r.status===404)return;
      if(r.status===409&&i<3){await new Promise(z=>setTimeout(z,500));continue}
      if(r.status===422){const g=await gh('GET',contents(f.path)+'?ref='+enc(cfg.branch));if(g.status===404)return;if(g.ok&&i<3){sha=(await g.json()).sha;continue}}
      await must(r);return;
    }
  }).then(()=>{cacheDel(f.path);cacheDel(f.path+'.preview.jpg');if(f.thumb)deleteFile({path:f.thumb.path,sha:f.thumb.sha,name:'미리보기'})}).catch(()=>{});
}
const CACHE='drawer-files-v1';
const ckey=p=>new URL('__f/'+p,location.href).href;
async function cacheGet(p){try{if(!('caches'in window))return null;const c=await caches.open(CACHE);const r=await c.match(ckey(p));return r?await r.blob():null}catch(e){return null}}
async function cachePut(p,blob,type){try{if(!('caches'in window))return;const c=await caches.open(CACHE);await c.put(ckey(p),new Response(blob,{headers:{'Content-Type':type||blob.type||'application/octet-stream'}}))}catch(e){}}
async function cacheDel(p){try{if('caches'in window){const c=await caches.open(CACHE);await c.delete(ckey(p))}}catch(e){}const u=urls.get(p);if(u){URL.revokeObjectURL(u);urls.delete(p)}}
const urls=new Map(),flights=new Map();
async function fileBlob(f){
  let b=await cacheGet(f.path);if(b)return b.type?b:new Blob([b],{type:f.type});
  const r=await must(await gh('GET',contents(f.path)+'?ref='+enc(cfg.branch),null,{Accept:'application/vnd.github.raw+json'}));
  b=new Blob([await r.arrayBuffer()],{type:f.type||'application/octet-stream'});
  cachePut(f.path,b,f.type);return b;
}
function fileURL(f){
  if(urls.has(f.path))return Promise.resolve(urls.get(f.path));
  if(flights.has(f.path))return flights.get(f.path);
  const p=fileBlob(f).then(b=>{const u=URL.createObjectURL(b);urls.set(f.path,u);return u}).finally(()=>flights.delete(f.path));
  flights.set(f.path,p);return p;
}
function findFile(path){
  const pick=f=>{if(f.path===path)return f;if(f.thumb&&f.thumb.path===path)return{path:f.thumb.path,type:'image/jpeg',name:'미리보기'};return null};
  for(const n of display())for(const f of(n.files||[])){const r=pick(f);if(r)return r}
  if(st.ed)for(const f of st.ed.keep){const r=pick(f);if(r)return r}
  return null;
}
/* PDF first-page preview: made at upload time; older PDFs get one drawn on this device and cached */
async function makePdfThumb(blob){
  const lib=await loadPdfJs();
  const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
  try{
    const pg=await pdf.getPage(1),v1=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(3,1000/v1.width)});
    const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:v}).promise;
    const out=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    if(!out)throw new Error('thumb');
    return{blob:out,w:c.width,h:c.height,pages:pdf.numPages};
  }finally{try{pdf.destroy()}catch(e){}}
}
const thumbFlights=new Map();
function localThumbURL(f){
  const key=f.path+'.preview.jpg';
  if(urls.has(key))return Promise.resolve(urls.get(key));
  if(thumbFlights.has(key))return thumbFlights.get(key);
  const p=(async()=>{
    let b=await cacheGet(key);
    if(!b){b=(await makePdfThumb(await fileBlob(f))).blob;cachePut(key,b,'image/jpeg')}
    const u=URL.createObjectURL(b);urls.set(key,u);return u;
  })().finally(()=>thumbFlights.delete(key));
  thumbFlights.set(key,p);return p;
}
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);hydrate(e.target)}}),{rootMargin:'800px'}):null;
function hydrate(el){
  const show=u=>{el.onload=()=>el.classList.add('on');el.src=u;if(el.complete&&el.naturalWidth)el.classList.add('on')};
  if(el.dataset.pdfthumb){const f=findFile(el.dataset.pdfthumb);if(f)localThumbURL(f).then(show).catch(()=>{});return}
  const f=findFile(el.dataset.path);if(!f)return;
  fileURL(f).then(show).catch(()=>{el.alt='불러오지 못함'});
}
function hydrateAll(root){root.querySelectorAll('[data-path],[data-pdfthumb]').forEach(el=>{
  const key=el.dataset.path||(el.dataset.pdfthumb+'.preview.jpg');
  if(urls.has(key)){el.src=urls.get(key);el.classList.add('on')}else if(io)io.observe(el);else hydrate(el)})}

function inSeg(n,k){const fs=n.files||[];if(k==='pinned')return!!n.pinned;if(k==='photos')return fs.some(f=>isImg(f)||isVid(f));if(k==='files')return fs.some(isDoc);return true}

function cardHTML(n){
  const fs=n.files||[],media=fs.filter(f=>isImg(f)||isVid(f)),docs=fs.filter(isDoc);
  let h='<div class="card'+(st.flash===n.id?' flash':'')+(n._local?' sending':'')+'" role="button" tabindex="0" data-id="'+esc(n.id)+'" id="c-'+esc(n.id)+'">';
  if(media.length){
    const shown=media.slice(0,4),k=shown.length;
    h+='<div class="pics n'+k+'">'+shown.map((m,i)=>{
      let ar='';if(k===1){const r=(m.w&&m.h)?m.w/m.h:1.33;ar=' style="aspect-ratio:'+r.toFixed(4)+'"'}
      const inner=isImg(m)?'<img alt="" data-path="'+esc(m.path)+'">':'<div class="play"><span>'+IC.play+'</span></div>';
      const more=(i===3&&media.length>4)?'<span class="more">+'+(media.length-4)+'</span>':'';
      return'<div class="pic"'+ar+'>'+inner+more+'</div>';
    }).join('')+'</div>';
  }
  if(docs.length)h+='<div class="docs">'+docs.slice(0,3).map(d=>{
    const row='<div class="ftile"><span class="ext'+(isPdf(d)?' pdf':'')+'">'+esc(extOf(d))+'</span><b>'+esc(d.name||'파일')+'</b><small>'+(d.pages?d.pages+'쪽 · ':'')+fmtSize(d.size)+'</small></div>';
    if(!isPdf(d))return row;

    const img=t?'<img alt="" data-path="'+esc(t.path)+'">':'<img alt="" data-pdfthumb="'+esc(d.path)+'">';

  }).join('')+(docs.length>3?'<div class="ftile"><b>외 '+(docs.length-3)+'개</b></div>':'')+'</div>';
  const t=(n.text||'').replace(/^\s+|\s+$/g,'');
  if(t)h+='<p class="ctext">'+esc(t)+'</p>';
  h+='<div class="cm">'+(n.pinned?IC.pin:'')+'<span>'+rel(n.createdAt)+'</span></div></div>';
  return h;
}
function render(){
  if(!cfg)return;

  $('#seg').innerHTML=SEGS.map(s=>{const c=s.k==='all'?0:all.filter(n=>inSeg(n,s.k)).length;return'<button type="button" data-k="'+s.k+'" aria-pressed="'+(st.seg===s.k)+'">'+s.l+(c?'<span class="n">'+c+'</span>':'')+'</button>'}).join('');

    const list=visible(all);
    if(!list.length){
      main.innerHTML='<div class="empty">'+(all.length?(st.q?'<p>“'+esc(st.q)+'”에 맞는 메모가 없어요.</p>':'<p>'+({pinned:'고정한 메모가 없어요. 메모를 열고 핀을 누르세요.',photos:'사진이나 동영상이 든 메모가 없어요.',files:'PDF나 파일이 든 메모가 없어요.'}[st.seg])+'</p>'):'<b>서랍이 비어 있어요</b><p>오른쪽 아래 새 메모로 글, 사진, PDF를 넣어 두세요.</p>')+'</div>';
    }else{

function openViewer(id){st.view=id;st.confirm=false;$('#viewer').hidden=false;lock(true);renderViewer()}
function closeViewer(){st.view=null;st.confirm=false;viewToken++;$('#viewer').hidden=true;lock(!!st.ed)}
function renderViewer(){
  const P=$('#vpanel');viewToken++;const tok=viewToken;
  if(st.view==='settings'){renderSettings(P);return}
  const n=display().find(x=>x.id===st.view);if(!n){closeViewer();return}
  st.viewSig=sig(n);
  const fs=n.files||[],t=(n.text||'').replace(/^\s+|\s+$/g,'');
  let body='<div class="vmeta"><span>'+fFull.format(n.createdAt)+'</span>'+(n.updatedAt&&n.updatedAt-n.createdAt>60000?'<span>수정 '+rel(n.updatedAt)+'</span>':'')+(n.pinned?'<span class="pinned">고정됨</span>':'')+'</div>';
  fs.filter(isImg).forEach(f=>{body+='<button type="button" class="vimg" data-img="'+esc(f.path)+'" aria-label="사진 크게 보기"'+(f.w?' style="aspect-ratio:'+f.w+'/'+f.h+'"':'')+'><img alt="'+esc(f.name||'사진')+'" data-path="'+esc(f.path)+'"></button>'});
  fs.filter(isVid).forEach(f=>{body+='<video controls playsinline preload="metadata" data-path="'+esc(f.path)+'"></video>'});
  fs.filter(isDoc).forEach((f,i)=>{
    body+='<div class="frow"><span class="ext'+(isPdf(f)?' pdf':'')+'">'+esc(extOf(f))+'</span><span class="fn"><b>'+esc(f.name||'파일')+'</b><small>'+fmtSize(f.size)+'</small></span><button type="button" class="open" data-share="'+esc(f.path)+'">내보내기</button></div>';
    if(isPdf(f))body+='<div class="pdf" data-pdf="'+esc(f.path)+'"><div class="note">PDF 불러오는 중…</div></div>';
    else if(isText(f))body+='<pre class="tview" data-text="'+esc(f.path)+'">불러오는 중…</pre>';
  });
  if(t)body+='<p class="vtext">'+linkify(t)+'</p>';
  const local=!!n._local;
  P.innerHTML='<div class="bar"><button class="tb" data-a="close">닫기</button><div class="spacer"></div>'+
    '<button class="tb" data-a="pin" aria-label="'+(n.pinned?'고정 해제':'고정')+'" title="'+(n.pinned?'고정 해제':'고정')+'"'+(n.pinned?' style="color:var(--pin)"':'')+(local?' disabled':'')+'>'+(n.pinned?IC.pin:IC.pinO)+'</button>'+
    '<button class="tb" data-a="copy" aria-label="글 복사" title="글 복사">'+IC.copy+'</button>'+
    '<button class="tb" data-a="edit" aria-label="편집" title="편집"'+(local?' disabled':'')+'>'+IC.edit+'</button>'+
    '<button class="tb danger" data-a="del" aria-label="삭제" title="삭제"'+(local?' disabled':'')+'>'+IC.del+'</button></div>'+
    '<div class="scroll" id="vscroll">'+body+'</div>'+
    (st.confirm?'<div class="confirm"><p>이 메모'+(fs.length?'와 첨부 '+fs.length+'개':'')+'를 지울까요?</p><button class="pill" data-a="nodel">취소</button><button class="pill danger" data-a="yesdel">삭제</button></div>':'');
  P.querySelectorAll('img[data-path],video[data-path]').forEach(el=>{const f=findFile(el.dataset.path);if(f)fileURL(f).then(u=>{if(tok===viewToken){el.src=u;el.classList.add('on')}}).catch(()=>{})});
  P.querySelectorAll('[data-text]').forEach(el=>{const f=findFile(el.dataset.text);if(f)fileBlob(f).then(b=>b.text()).then(s=>{if(tok===viewToken)el.textContent=s.length>200000?s.slice(0,200000)+'\n…':s}).catch(()=>{el.textContent='불러오지 못했어요.'})});
  P.querySelectorAll('[data-pdf]').forEach(el=>{const f=findFile(el.dataset.pdf);if(f)renderPdf(el,f,tok)});
}
let pdfjsP=null;
function loadPdfJs(){if(pdfjsP)return pdfjsP;pdfjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFJS+'pdf.min.js';s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};s.onerror=()=>{pdfjsP=null;rej(new Error('pdfjs'))};document.head.appendChild(s)});return pdfjsP}
async function renderPdf(el,f,tok){
  try{
    const [lib,blob]=await Promise.all([loadPdfJs(),fileBlob(f)]);
    const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    if(tok!==viewToken)return;
    el.innerHTML='';
    const first=await pdf.getPage(1),v1=first.getViewport({scale:1});
    const pages=[];
    for(let i=1;i<=pdf.numPages;i++){const d=document.createElement('div');d.className='pg';d.style.aspectRatio=v1.width+'/'+v1.height;d.dataset.page=i;el.appendChild(d);pages.push(d)}
    const draw=async d=>{
      if(d.dataset.done)return;d.dataset.done='1';
      const pg=await pdf.getPage(+d.dataset.page);if(tok!==viewToken)return;
      const w=el.clientWidth||600,dpr=Math.min(window.devicePixelRatio||1,2.5);
      const vp=pg.getViewport({scale:1});const sc=w*dpr/vp.width;const v=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
      d.style.aspectRatio=vp.width+'/'+vp.height;d.appendChild(c);
      await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    };
    if('IntersectionObserver'in window){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){o.unobserve(e.target);draw(e.target)}}),{root:$('#vscroll'),rootMargin:'1200px'});pages.forEach(p=>o.observe(p))}
    else for(const p of pages)await draw(p);
  }catch(e){if(tok===viewToken)el.innerHTML='<div class="note">이 화면에서 PDF를 그리지 못했어요. 내보내기로 열어 주세요.</div>'}
}
async function shareFile(f){
  let blob;try{blob=await fileBlob(f)}catch(e){toast(errText(e));return}
  const file=new File([blob],f.name||'file',{type:f.type||blob.type});
  if(navigator.canShare&&navigator.share){try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=f.name||'file';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);
}
$('#viewer').addEventListener('click',async e=>{
  if(e.target.id==='viewer'){closeViewer();return}
  const im=e.target.closest('[data-img]');if(im){openLightbox(im.dataset.img);return}
  const sh=e.target.closest('[data-share]');if(sh){const f=findFile(sh.dataset.share);if(f)shareFile(f);return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='close'){closeViewer();return}
  if(st.view==='settings'){settingsAction(a,b);return}
  const n=display().find(x=>x.id===st.view);if(!n)return;
  if(a==='pin'){const on=!n.pinned;mutate(ns=>{const x=ns.find(z=>z.id===n.id);if(x){x.pinned=on;x.pinnedAt=on?Date.now():0}},on?'고정':'고정 해제').then(()=>toast(on?'고정했어요':'고정을 풀었어요'),err=>toast(errText(err)))}
  else if(a==='copy'){const t=n.text||'';if(!t.trim()){toast('복사할 글이 없어요');return}
    try{await navigator.clipboard.writeText(t);toast('복사했어요')}catch(err){const el=$('#vscroll .vtext');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('글을 선택해 두었어요. 직접 복사해 주세요.')}}
  else if(a==='edit')openEditor(n);
  else if(a==='del'){st.confirm=true;renderViewer()}
  else if(a==='nodel'){st.confirm=false;renderViewer()}
  else if(a==='yesdel'){
    const files=(n.files||[]).slice();closeViewer();
    mutate(ns=>{const i=ns.findIndex(z=>z.id===n.id);if(i>-1)ns.splice(i,1)},'메모 삭제').then(()=>{toast('삭제했어요');files.forEach(deleteFile)},err=>toast(errText(err)));
  }
});

  ed.style.setProperty('--kb',kb+'px');ed.classList.toggle('kbopen',kb>80);

/* paste button: reads photos or text straight from the clipboard (iOS shows a small "붙여넣기" bubble to confirm) */
$('#edPasteBtn').addEventListener('click',async()=>{
  const cb=navigator.clipboard;
  if(cb&&cb.read){
    try{
      const items=await cb.read();const files=[];let text='';
      for(const it of items){
        const it2=it.types.find(t=>/^image\//.test(t));
        if(it2){const b=await it.getType(it2);files.push(new File([b],'붙여넣은 사진.'+((it2.split('/')[1]||'png').replace('jpeg','jpg')),{type:it2}))}
        else if(it.types.includes('text/plain'))text+=await(await it.getType('text/plain')).text();
      }
      if(files.length)addFiles(files);else if(text)insertText(text);else toast('복사해 둔 사진이나 글이 없어요');
      return;
    }catch(e){if(e&&e.name==='NotAllowedError'){toast('붙여넣기가 취소됐어요');return}}
  }
  if(cb&&cb.readText){try{const t=await cb.readText();if(t)insertText(t);else toast('복사해 둔 글이 없어요');return}catch(e){}}
  toast('이 브라우저에서는 붙여넣기 버튼을 쓸 수 없어요. 입력칸을 길게 눌러 붙여넣어 주세요.');
});

const OK_IMG=['image/png','image/jpeg','image/gif','image/webp'];
const TYPE_BY_EXT={pdf:'application/pdf',txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',m4v:'video/mp4'};
function loadImg(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b),im=new Image();im.onload=()=>res({im,u,w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>{URL.revokeObjectURL(u);rej({code:'decode_failed'})};im.src=u})}
function cap(p){if(p.blob.size>MAX_FILE)throw{code:'too_large'};return p}
async function prepare(file){
  const ext=((file.name||'').split('.').pop()||'').toLowerCase();let type=file.type||TYPE_BY_EXT[ext]||'application/octet-stream';
  const base={name:file.name||'사진',key:uid()};
  if(/^image\//.test(type)||['heic','heif','jpg','jpeg','png','gif','webp'].includes(ext)){
    const {im,u,w,h}=await loadImg(file);
    const keep=OK_IMG.includes(type)&&(type==='image/gif'?file.size<=MAX_FILE:(Math.max(w,h)<=2600&&file.size<=2.5e6));
    if(keep)return{...base,blob:file,type,kind:'image',w,h,url:u};
    const sc=Math.min(1,2400/Math.max(w,h)),cw=Math.round(w*sc),chh=Math.round(h*sc);
    const cv=document.createElement('canvas');cv.width=cw;cv.height=chh;cv.getContext('2d').drawImage(im,0,0,cw,chh);URL.revokeObjectURL(u);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.86));if(!blob)throw{code:'decode_failed'};
    return{...base,name:base.name.replace(/\.[^.]+$/,'')+'.jpg',blob,type:'image/jpeg',kind:'image',w:cw,h:chh,url:URL.createObjectURL(blob)};
  }
  if(/^video\//.test(type))return cap({...base,blob:file,type,kind:'video'});
  if(type==='application/pdf'){
    const p=cap({...base,blob:file,type,kind:'file'});
    try{const t=await makePdfThumb(file);p.thumb={blob:t.blob,w:t.w,h:t.h};p.pages=t.pages;p.url=URL.createObjectURL(t.blob)}catch(e){}
    return p;
  }
  return cap({...base,blob:file,type,kind:'file'});
}
async function addFiles(fs){
  for(const f of fs){if(!st.ed)return;
    if(st.ed.keep.length+st.ed.pending.length>=20){toast('메모 하나에 20개까지 붙일 수 있어요');break}
    try{st.ed.pending.push(await prepare(f))}catch(e){toast(errText(e))}}
  renderTray();
}
async function save(){
  const e=st.ed;if(!e||st.busy)return;
  const text=edText.value.replace(/\s+$/,'');
  if(!text.trim()&&!e.keep.length&&!e.pending.length){toast('내용이 비어 있어요');return}
  if(!navigator.onLine){toast('인터넷에 연결되어 있지 않아요. 연결되면 다시 저장해 주세요.');return}
  st.busy=true;const btn=$('#edSave');btn.disabled=true;
  try{
    const added=[];
    for(let i=0;i<e.pending.length;i++){btn.textContent='올리는 중 '+(i+1)+'/'+e.pending.length;added.push(await uploadFile(e.pending[i]))}
    btn.textContent='저장 중';
    const files=e.keep.concat(added),now=Date.now();
    if(e.id){
      const id=e.id,gone=e.orig.filter(f=>!files.some(k=>k.path===f.path));
      closeEditor();
      await mutate(ns=>{const x=ns.find(z=>z.id===id);if(x){x.text=text;x.files=files;x.updatedAt=now}},'메모 수정');
      toast('저장했어요');gone.forEach(deleteFile);
    }else{
      const id=uid();LS.set('drawer-draft',null);closeEditor();
      if(st.seg!=='all'||st.q){st.seg='all';st.q='';$('#q').value=''}
      st.flash=id;
      const p=mutate(ns=>{ns.push({id,text,files,pinned:false,pinnedAt:0,createdAt:now,updatedAt:now})},'새 메모');
      requestAnimationFrame(()=>{const el=document.getElementById('c-'+id);if(el)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
      setTimeout(()=>{st.flash=null},1600);
      try{await p;toast('저장했어요')}
      catch(err){if(text)LS.set('drawer-draft',text);toast(errText(err)+(text?' 쓴 글은 새 메모 창에 남겨 두었어요.':''),5000)}
    }
  }catch(err){toast(errText(err),4000);if(st.ed){}}
  st.busy=false;btn.disabled=false;btn.textContent='저장';
}

/* drag & drop */
let dn=0;const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(!cfg||!hasFiles(e))return;dn++;$('#drop').hidden=false});
window.addEventListener('dragleave',()=>{dn=Math.max(0,dn-1);if(!dn)$('#drop').hidden=true});
window.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
window.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dn=0;$('#drop').hidden=true;if(!cfg)return;const fs=[...e.dataTransfer.files];if(st.ed)addFiles(fs);else openEditor(null,fs)});

/* ---------- sync loop ---------- */
let lastSync=0;
function sync(force){
  if(!cfg||!navigator.onLine)return Promise.resolve();
  lastSync=Date.now();
  return enqueue(()=>pull(force)).then(ch=>{st.loaded=true;if(ch!==false)render();else if(!st.loaded)render()}).catch(e=>{st.loaded=true;render();if(e&&e.status!==401)setStatus(errText(e),true)});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastSync>4000)sync()});
window.addEventListener('focus',()=>{if(Date.now()-lastSync>4000)sync()});
setInterval(()=>{if(document.visibilityState==='visible')sync()},30000);

/* ---------- setup screen ---------- */
function showSetup(msg){
  $('#app').hidden=true;$('#fab').hidden=true;const S=$('#setup');S.hidden=false;
  S.innerHTML='<div class="setup">'+
    '<h1>서랍 연결</h1><p>메모는 내 비공개 GitHub 저장소에 저장돼요. 이 기기에서 처음 한 번만 연결하면 돼요.</p>'+
    '<div class="field"><label for="sCode">설정 코드</label><textarea id="sCode" placeholder="여기를 눌러 붙여넣기" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><small>맥 서랍의 설정 → 설정 코드 복사로 얻은 DRW1:로 시작하는 코드</small></div>'+
    '<button class="btns" id="sPaste" type="button">클립보드에서 붙여넣기</button>'+
    '<button class="btnp" id="sCodeGo">코드로 연결</button>'+
    '<p class="err" id="sCodeErr" hidden></p>'+
    '<div class="or">처음 연결한다면</div>'+
    '<div class="field"><label for="sOwner">GitHub 아이디</label><input id="sOwner" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="github.com/ 뒤에 오는 이름"></div>'+
    '<div class="field"><label for="sRepo">데이터 저장소 이름</label><input id="sRepo" autocapitalize="off" spellcheck="false" value="drawer-data"><small>비공개 저장소여야 해요.</small></div>'+
    '<div class="field"><label for="sToken">토큰</label><input id="sToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…"><small><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기</a> · 저장소 접근은 데이터 저장소 하나만, 권한은 Contents 읽기·쓰기.</small></div>'+
    '<button class="btns" id="sGo">연결</button>'+
    '<p class="err" id="sErr"'+(msg?'':' hidden')+'>'+esc(msg||'')+'</p>'+
  '</div>';
  const showErr=(id,m)=>{const el=$(id);el.hidden=false;el.textContent=m;el.scrollIntoView({block:'center',behavior:'smooth'})};
  let busy=false;
  const go=async(c,errId,btnId)=>{
    if(busy)return;busy=true;
    $('#sErr').hidden=true;$('#sCodeErr').hidden=true;
    const btn=$(btnId),label=btn.textContent;btn.textContent='연결 중…';
    $('#sGo').disabled=$('#sCodeGo').disabled=true;
    try{await connect(c)}catch(e){showErr(errId,e&&e.userMsg||errText(e))}
    finally{busy=false;const a=$('#sGo'),b=$('#sCodeGo');if(a)a.disabled=false;if(b)b.disabled=false;if(document.body.contains(btn))btn.textContent=label}
  };
  const tryCode=()=>{
    const v=$('#sCode').value;
    if(!v.trim()){showErr('#sCodeErr','설정 코드 칸이 비어 있어요. 칸을 길게 눌러 붙여넣기를 누르거나 위의 붙여넣기 버튼을 눌러 주세요.');return}
    const c=parseCode(v);
    if(!c){showErr('#sCodeErr','설정 코드가 올바르지 않아요. 맥 서랍의 설정에서 설정 코드 복사를 다시 누른 뒤 붙여넣어 주세요.');return}
    go(c,'#sCodeErr','#sCodeGo');
  };
  $('#sCodeGo').addEventListener('click',tryCode);
  $('#sCode').addEventListener('input',()=>{if(parseCode($('#sCode').value))tryCode()});
  $('#sPaste').addEventListener('click',async()=>{
    try{const t=await navigator.clipboard.readText();$('#sCode').value=t||'';if(parseCode(t))tryCode();else showErr('#sCodeErr','클립보드에 설정 코드가 없어요. 맥에서 설정 코드 복사를 다시 눌러 주세요.')}
    catch(e){$('#sCode').focus();showErr('#sCodeErr','이 브라우저는 버튼 붙여넣기를 막아요. 설정 코드 칸을 길게 눌러 붙여넣기를 선택해 주세요.')}
  });
  $('#sGo').addEventListener('click',()=>{
    const o=$('#sOwner').value.trim().replace(/^@/,''),r=$('#sRepo').value.trim(),t=$('#sToken').value.trim();
    if(!o||!r||!t){showErr('#sErr','아이디, 저장소 이름, 토큰을 모두 적어 주세요.');return}
    go({owner:o,repo:r,token:t,branch:'main'},'#sErr','#sGo');
  });
}
async function connect(c){
  if(!navigator.onLine)throw{code:'offline'};
  const prev=cfg;cfg=c;
  try{
    const r=await gh('GET',repoBase());
    if(r.status===401)throw{userMsg:'토큰이 올바르지 않아요. 다시 복사해 붙여넣어 주세요.'};
    if(r.status===404)throw{userMsg:'저장소를 찾지 못했어요. 아이디·저장소 이름과, 토큰이 이 저장소에 접근하도록 만들어졌는지 확인해 주세요.'};
    await must(r);const j=await r.json();
    if(!j.private)throw{userMsg:'이 저장소는 공개 상태예요. 메모가 다른 사람에게 보일 수 있으니 비공개로 바꾼 뒤 연결해 주세요.'};
    cfg.branch=j.default_branch||c.branch||'main';cfg.owner=j.owner&&j.owner.login||c.owner;cfg.repo=j.name||c.repo;
    server={notes:[],sha:null,etag:null};
    await pull(true);
  }catch(e){cfg=prev;throw e}
  LS.set('drawer-cfg',JSON.stringify(cfg));
  st.loaded=true;startApp();
}
function startApp(){
  $('#setup').hidden=true;$('#app').hidden=false;$('#fab').hidden=false;
  render();
  if(location.hash.slice(1).toLowerCase()==='new'){history.replaceState(null,'',location.pathname+location.search);openEditor(null)}
}

/* ---------- boot ---------- */
function readHash(){const h=(location.hash||'').slice(1).toLowerCase();if(HASH[h])st.seg=HASH[h]}
window.addEventListener('hashchange',()=>{readHash();if(location.hash.slice(1).toLowerCase()==='new'&&cfg){openEditor(null)}render()});
readHash();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!cfg)showSetup();
else{
  st.loaded=loadCache();startApp();
  if(!navigator.onLine)setStatus('오프라인 · 저장된 메모만 보여요',true);
  sync(true);
}
})();
</script>
